[project]
name = "pyrinx"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "prompt-toolkit>=3.0.53",
    "pygments>=2.19",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "selectolax>=0.4.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
